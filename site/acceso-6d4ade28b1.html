<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F1115">
<title>Acceso · Oleohidráulica Especializada de Irapuato</title>
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Inter+Tight:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F1115;--card:#171A20;--card2:#14171C;--line:#262B33;--line2:#2F353E;--tx:#F2F3F5;--mut:#A3AAB4;--dim:#8A929C;--or:#FF7900;--or2:#E8650F}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:32px 32px;color:var(--tx);font-family:'Inter Tight',system-ui,sans-serif;-webkit-text-size-adjust:100%}
button,input{font:inherit}
.hidden{display:none!important}
.mono{font-family:'IBM Plex Mono',monospace;letter-spacing:.16em;text-transform:uppercase;font-size:.72rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;border-radius:12px;padding:14px 20px;font-weight:700;color:#fff;background:linear-gradient(135deg,#F57A28,#D2560C);box-shadow:0 10px 24px rgba(232,101,15,.25);text-decoration:none}
.btn:disabled{opacity:.6;cursor:wait}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;border-radius:12px;padding:10px 14px;font-weight:600;color:var(--tx);background:var(--card);border:1px solid var(--line2);text-decoration:none}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--tx)}
.brand img{height:46px;width:auto}
.brand b{display:block;font-family:Archivo,sans-serif;font-weight:800;font-size:1.05rem}
.brand i{display:block;font-style:normal;font-family:Archivo,sans-serif;font-weight:600;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--or2)}
h1{margin:0;font-family:Archivo,sans-serif;font-weight:900;font-stretch:80%;text-transform:uppercase;font-size:1.9rem;line-height:1}
h1 span{color:var(--or)}
/* candado */
#lock{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px 16px;position:relative;overflow:hidden}
#lock::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 40%,rgba(255,121,0,.16),transparent 70%);pointer-events:none}
.lcard{position:relative;width:100%;max-width:400px;background:rgba(23,26,32,.92);border:1px solid var(--line);border-radius:26px;padding:34px 26px 26px;box-shadow:0 40px 80px rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px}
.padlock{width:76px;height:76px;border-radius:22px;background:rgba(255,121,0,.12);border:1px solid rgba(255,121,0,.4);display:flex;align-items:center;justify-content:center}
.padlock svg{transition:transform .3s}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pw{position:relative;width:100%}
.fld{width:100%;background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:15px 84px 15px 15px;color:var(--tx);outline:none;font-size:1.05rem;text-align:left}
.fld:focus{border-color:var(--or);box-shadow:0 0 0 3px rgba(255,121,0,.18)}
.pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--dim);cursor:pointer;font-size:.8rem;font-weight:600;padding:8px}
.err{color:#FECACA;font-size:.88rem;min-height:1.2em}
.small{font-size:.8rem;color:var(--dim)}
.small a{color:#FF9A4D}
/* biblioteca */
header.top{position:sticky;top:0;z-index:20;background:rgba(15,17,21,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid #22262D}
.topin{max-width:1280px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.topin .brand img{height:40px}
main{max-width:1280px;margin:0 auto;padding:28px 20px 80px;display:flex;flex-direction:column;gap:22px}
.bar{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.search{background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;color:var(--tx);outline:none;min-width:240px}
.search:focus{border-color:var(--or)}
.fold{font-family:'IBM Plex Mono',monospace;font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:#FF9A4D;margin:6px 0 -6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:14px}
.item{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;cursor:pointer;text-align:left;color:var(--tx);transition:border-color .2s,transform .2s}
.item:hover{border-color:rgba(255,121,0,.55);transform:translateY(-2px)}
.ic{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff}
.ic.pdf{background:linear-gradient(135deg,#F57A28,#C2410C)}.ic.video{background:linear-gradient(135deg,#6366F1,#4338CA)}.ic.image{background:linear-gradient(135deg,#14B8A6,#0F766E)}.ic.link{background:linear-gradient(135deg,#1AB7EA,#0E7FA6)}
.nm{font-weight:700;font-size:1rem;line-height:1.3;word-break:break-word}
.meta{font-size:.78rem;color:var(--dim)}
.empty{border:1.5px dashed var(--line2);border-radius:22px;padding:48px 20px;text-align:center;color:var(--mut)}
/* visor */
#viewer{position:fixed;inset:0;z-index:70;background:#0B0D10;display:flex;flex-direction:column}
.vbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border-bottom:1px solid #22262D;background:#12151A;transition:opacity .3s}
.vtitle{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1;text-align:center}
.vbody{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:pan-y pinch-zoom}
.vbody canvas{max-width:100%;max-height:100%;box-shadow:0 10px 40px rgba(0,0,0,.5);background:#fff}
.vbody video,.vbody img{max-width:100%;max-height:100%}
.nav{position:absolute;top:0;bottom:0;width:22%;border:0;background:transparent;cursor:pointer;color:transparent}
.nav.l{left:0}.nav.r{right:0}
.vfoot{display:flex;align-items:center;justify-content:center;gap:12px;padding:8px;background:#12151A;border-top:1px solid #22262D}
.vfoot .ghost{padding:8px 14px}
.pg{font-family:'IBM Plex Mono',monospace;font-size:.85rem;color:var(--mut);min-width:80px;text-align:center}
.loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--mut)}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid #2F353E;border-top-color:var(--or);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#viewer:fullscreen .vbar,#viewer:fullscreen .vfoot{opacity:.0}
#viewer:fullscreen .vbar:hover,#viewer:fullscreen .vfoot:hover{opacity:1}
@media (max-width:640px){
 .topin{padding:8px 12px}.topin .brand i{display:none}
 main{padding:20px 14px 70px}
 .search{min-width:0;width:100%}
 .grid{grid-template-columns:1fr 1fr;gap:10px}
 .item{padding:14px;gap:10px;border-radius:16px}
 .ic{width:42px;height:42px}
 .nm{font-size:.88rem}
 h1{font-size:1.6rem}
 .vbar .ghost{padding:8px 10px;font-size:.82rem}
}
</style>
</head>
<body>

<section id="lock">
  <form class="lcard" id="lockForm" autocomplete="off">
    <a class="brand" href="./"><img src="logo.svg" alt="Oleohidráulica Especializada de Irapuato"><span><b>Oleohidráulica</b><i>Especializada de Irapuato</i></span></a>
    <div class="padlock" id="padlock"><svg id="padIcon" width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#FF9A4D" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path id="shackle" d="M8 11V8a4 4 0 018 0v3"/><circle cx="12" cy="16" r="1.4" fill="#FF9A4D"/></svg></div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <span class="mono" style="color:#FF9A4D">Acceso restringido</span>
      <h1>Área de <span>presentaciones</span></h1>
    </div>
    <div class="pw"><input class="fld" id="pass" type="password" placeholder="Contraseña" autocomplete="off" autocapitalize="none" spellcheck="false" required aria-label="Contraseña"><button type="button" id="showPw">Mostrar</button></div>
    <div class="err" id="err" role="alert"></div>
    <button class="btn" id="go" type="submit" style="width:100%">Entrar</button>
    <p class="small">Uso exclusivo del personal de OEI · <a href="./">Volver al sitio</a></p>
  </form>
</section>

<div id="app" class="hidden">
  <header class="top"><div class="topin">
    <a class="brand" href="./"><img src="logo.svg" alt="Oleohidráulica Especializada de Irapuato"><span><b>Oleohidráulica</b><i>Presentaciones</i></span></a>
    <button class="ghost" id="out" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>Cerrar</button>
  </div></header>
  <main>
    <div class="bar">
      <div style="display:flex;flex-direction:column;gap:8px"><span class="mono" style="color:#FF9A4D">Biblioteca</span><h1>Presentaciones</h1></div>
      <input class="search" id="q" type="search" placeholder="Buscar…" autocomplete="off">
    </div>
    <div id="list"></div>
  </main>
</div>

<div id="viewer" class="hidden">
  <div class="vbar">
    <button class="ghost" id="vclose" type="button">← Volver</button>
    <span class="vtitle" id="vtitle"></span>
    <button class="ghost" id="vfull" type="button">Pantalla completa</button>
  </div>
  <div class="vbody" id="vbody"></div>
  <div class="vfoot" id="vfoot"><button class="ghost" id="prev" type="button" aria-label="Anterior">‹</button><span class="pg" id="pg"></span><button class="ghost" id="next" type="button" aria-label="Siguiente">›</button></div>
</div>

<script>
(function(){
  var $=function(id){return document.getElementById(id);}, key=null, items=[], cache={};
  var PDFJS='pdfjs/';
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function size(b){var u=['B','KB','MB','GB'],i=0;while(b>=1024&&i<3){b/=1024;i++;}return b.toFixed(i?1:0)+' '+u[i];}
  function hex(h){var a=new Uint8Array(h.length/2);for(var i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a;}
  async function getBin(url){var r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('http '+r.status);return new Uint8Array(await r.arrayBuffer());}
  async function dec(buf){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},key,buf.slice(12)));}

  // ---------- candado ----------
  $('showPw').onclick=function(){var p=$('pass'),s=p.type==='password';p.type=s?'text':'password';this.textContent=s?'Ocultar':'Mostrar';};
  $('lockForm').onsubmit=async function(e){
    e.preventDefault(); $('err').textContent='';
    if(!window.crypto||!crypto.subtle){$('err').textContent='Abra esta página desde el sitio publicado (https).';return;}
    var b=$('go'); b.disabled=true; b.textContent='Verificando…';
    try{
      var cfgR=await fetch('d-15dacb21f72b/salt.json',{cache:'no-store'});
      if(!cfgR.ok){ $('err').textContent='Aún no hay presentaciones cargadas.'; return; }
      var cfg=await cfgR.json();
      var base=await crypto.subtle.importKey('raw',new TextEncoder().encode($('pass').value),'PBKDF2',false,['deriveKey']);
      key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:hex(cfg.salt),iterations:cfg.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
      var m=JSON.parse(new TextDecoder().decode(await dec(await getBin('d-15dacb21f72b/m.bin'))));
      items=m.items||[]; $('pass').value='';
      $('shackle').setAttribute('d','M8 11V8a4 4 0 017.5-2');
      setTimeout(function(){ $('lock').classList.add('hidden'); $('app').classList.remove('hidden'); render(); },350);
    }catch(x){
      key=null; $('err').textContent='Contraseña incorrecta.';
      var pl=$('padlock'); pl.classList.remove('shake'); void pl.offsetWidth; pl.classList.add('shake'); $('pass').select();
    }finally{ b.disabled=false; b.textContent='Entrar'; }
  };
  $('out').onclick=function(){ location.reload(); };

  // ---------- biblioteca ----------
  var ICON={pdf:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>',
    video:'<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
    link:'<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
    image:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>'};
  var LBL={pdf:'Presentación',video:'Video',image:'Imagen',link:'Video en línea'};
  function render(){
    var q=$('q').value.trim().toLowerCase(), groups={};
    items.forEach(function(x,i){ if(q && (x.title+' '+x.folder).toLowerCase().indexOf(q)<0) return; (groups[x.folder]=groups[x.folder]||[]).push(i); });
    var keys=Object.keys(groups).sort(function(a,b){return a===''?-1:b===''?1:a.localeCompare(b,'es');});
    if(!keys.length){ $('list').innerHTML='<div class="empty">'+(items.length?'Sin resultados.':'Aún no hay presentaciones cargadas.')+'</div>'; return; }
    $('list').innerHTML=keys.map(function(k){
      return (k?'<div class="fold">'+esc(k)+'</div>':'')+'<div class="grid" style="margin-top:14px;margin-bottom:18px">'+groups[k].map(function(i){var x=items[i];
        return '<button class="item" type="button" data-i="'+i+'"><span class="ic '+x.kind+'">'+ICON[x.kind]+'</span><span class="nm">'+esc(x.title)+'</span><span class="meta">'+LBL[x.kind]+(x.size?' · '+size(x.size):'')+'</span></button>';}).join('')+'</div>';
    }).join('');
    $('list').querySelectorAll('.item').forEach(function(b){ b.onclick=function(){ openItem(items[+b.getAttribute('data-i')]); }; });
  }
  $('q').oninput=render;

  // ---------- visor ----------
  var pdf=null, page=1, rendering=false, pending=null;
  function loading(t){ $('vbody').innerHTML='<div class="loading"><div class="spin"></div><span>'+t+'</span></div>'; }
  function loadScript(src){ return new Promise(function(ok,ko){ var s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=ko; document.head.appendChild(s); }); }
  async function openItem(x){
    $('vtitle').textContent=x.title; $('viewer').classList.remove('hidden'); document.body.style.overflow='hidden';
    $('vfoot').classList.toggle('hidden', x.kind!=='pdf');
    loading('Abriendo…');
    if(x.kind==='link'){
      $('vbody').innerHTML=(x.embed?'<iframe src="'+esc(x.embed)+'" style="width:100%;height:100%;border:0;background:#000" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen title="'+esc(x.title)+'"></iframe>':'')+
        '<a class="btn" href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer" style="position:absolute;right:14px;bottom:14px">Abrir en Vimeo ↗</a>';
      return;
    }
    try{
      var data=cache[x.id]; if(!data){ data=await dec(await getBin('d-15dacb21f72b/'+x.id+'.bin')); cache[x.id]=data; }
      if(x.kind==='pdf'){
        if(!window.pdfjsLib){ await loadScript(PDFJS+'pdf.min.js'); pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js'; }
        pdf=await pdfjsLib.getDocument({data:data.slice()}).promise; page=1;
        $('vbody').innerHTML='<canvas id="cv"></canvas><button class="nav l" id="nl" aria-label="Anterior">‹</button><button class="nav r" id="nr" aria-label="Siguiente">›</button>';
        $('nl').onclick=function(){go(-1);}; $('nr').onclick=function(){go(1);};
        draw();
      } else {
        var url=URL.createObjectURL(new Blob([data],{type:x.mime}));
        $('vbody').innerHTML = x.kind==='video' ? '<video src="'+url+'" controls autoplay playsinline></video>' : '<img src="'+url+'" alt="'+esc(x.title)+'">';
      }
    }catch(e){ $('vbody').innerHTML='<div class="loading">No se pudo abrir el archivo. Revise su conexión e intente de nuevo.</div>'; }
  }
  async function draw(){
    if(!pdf) return; if(rendering){ pending=page; return; } rendering=true;
    var p=await pdf.getPage(page), box=$('vbody'), v=p.getViewport({scale:1});
    var s=Math.min((box.clientWidth-16)/v.width,(box.clientHeight-16)/v.height), dpr=Math.min(window.devicePixelRatio||1,2.5);
    var vp=p.getViewport({scale:s*dpr}), c=$('cv'); if(!c){rendering=false;return;}
    c.width=vp.width; c.height=vp.height; c.style.width=(vp.width/dpr)+'px'; c.style.height=(vp.height/dpr)+'px';
    await p.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    $('pg').textContent=page+' / '+pdf.numPages; rendering=false;
    if(pending!==null){ pending=null; draw(); }
  }
  function go(d){ if(!pdf) return; var n=Math.max(1,Math.min(pdf.numPages,page+d)); if(n!==page){ page=n; draw(); } }
  $('prev').onclick=function(){go(-1);}; $('next').onclick=function(){go(1);};
  document.addEventListener('keydown',function(e){
    if($('viewer').classList.contains('hidden')) return;
    if(['ArrowRight','PageDown',' '].indexOf(e.key)>-1){e.preventDefault();go(1);}
    if(['ArrowLeft','PageUp'].indexOf(e.key)>-1){e.preventDefault();go(-1);}
    if(e.key==='Escape' && !document.fullscreenElement) closeV();
  });
  var tx=null; $('vbody').addEventListener('touchstart',function(e){ tx=e.touches.length===1?e.touches[0].clientX:null; },{passive:true});
  $('vbody').addEventListener('touchend',function(e){ if(tx===null) return; var dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>50) go(dx<0?1:-1); tx=null; },{passive:true});
  var rt; window.addEventListener('resize',function(){ clearTimeout(rt); rt=setTimeout(draw,150); });
  document.addEventListener('fullscreenchange',function(){ setTimeout(draw,120); });
  function closeV(){ if(document.fullscreenElement) document.exitFullscreen().catch(function(){}); $('viewer').classList.add('hidden'); $('vbody').innerHTML=''; pdf=null; document.body.style.overflow=''; }
  $('vclose').onclick=closeV;
  $('vfull').onclick=function(){ var v=$('viewer'), rq=v.requestFullscreen||v.webkitRequestFullscreen;
    if(document.fullscreenElement) document.exitFullscreen(); else if(rq) rq.call(v).catch(function(){}); else { $('vfull').textContent='Gire su equipo'; setTimeout(function(){ $('vfull').textContent='Pantalla completa'; },2500); } };
})();
</script>
</body>
</html>
